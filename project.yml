name: LANDownloader
options:
  bundleIdPrefix: com.lantransfer
  deploymentTarget:
    iOS: '16.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1'
    CODE_SIGNING_ALLOWED: 'NO'
targets:
  LANDownloader:
    type: application
    platform: iOS
    sources:
      - path: iOS/LANDownloader
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lantransfer.downloader
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: LAN Downloader
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: '连接电脑的局域网视频服务器以查看和下载文件'
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsLocalNetworking: YES
        INFOPLIST_KEY_UIBackgroundModes: 'fetch'
        IPHONEOS_DEPLOYMENT_TARGET: '16.0'
        CODE_SIGNING_ALLOWED: NO
        SUPPORTS_MACCATALYST: NO
    info:
      path: iOS/LANDownloader/Info.plist
      properties:
        CFBundleDisplayName: LAN Downloader
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSLocalNetworkUsageDescription: '连接电脑的局域网视频服务器以查看和下载文件'
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            '192.168.0.245':
              NSExceptionAllowsInsecureHTTPLoads: true
              NSIncludesSubdomains: false
        UIBackgroundModes: [fetch]
