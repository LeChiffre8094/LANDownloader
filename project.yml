name: LANDownloader
options:
  bundleIdPrefix: com.lantransfer
  deploymentTarget:
    iOS: '16.0'
packages:
  KSPlayer:
    url: https://github.com/kingslay/KSPlayer.git
    exactVersion: 2.3.4
  FFmpegKit:
    url: https://github.com/kingslay/FFmpegKit.git
    exactVersion: 6.1.3
  SwiftSoup:
    url: https://github.com/scinfu/SwiftSoup.git
    exactVersion: 2.6.0
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1'
    IPHONEOS_DEPLOYMENT_TARGET: '16.0'
    CODE_SIGNING_ALLOWED: 'NO'
targets:
  LANDownloader:
    type: application
    platform: iOS
    sources:
      - path: iOS/LANDownloader
        excludes: [Info.plist]
    dependencies:
      - package: SwiftSoup
      - package: KSPlayer
      - package: FFmpegKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lantransfer.downloader
        INFOPLIST_FILE: iOS/LANDownloader/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: '0.2.0'
        CURRENT_PROJECT_VERSION: '2'
        SUPPORTS_MACCATALYST: NO
  LANDownloaderTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: LANDownloader
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  LANDownloader:
    build:
      targets:
        LANDownloader: all
        LANDownloaderTests: [test]
    test:
      targets: [LANDownloaderTests]
